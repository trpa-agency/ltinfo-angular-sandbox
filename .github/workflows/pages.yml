# Publishes a read-only copy of the sandbox to GitHub Pages.
#
# Pages has no API and no database, so the app reads Sandbox.Web/static-api/, the JSON
# snapshot that Sandbox.Web/scripts/export-static-api.mjs takes from the running Docker
# stack. Refresh and commit that folder after a reseed; this workflow only builds.
#
# One-time setup in the repository: Settings > Pages > Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sandbox.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Sandbox.Web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # A project site lives at https://<owner>.github.io/<repo>/, so the base path is the repository name.
      - run: node scripts/build-pages.mjs "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Sandbox.Web/dist/sandbox-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
