# Local development settings: ports, environment, and the bind mounts that give hot
# reload. Values in ${...} come from .env in this folder (copy .env.template).

services:
  sandbox.api:
    build:
      target: dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SandboxDb=Server=${DB_SERVER},1433;Database=${DB_NAME};User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
    ports:
      - "127.0.0.1:3211:8080"
    volumes:
      # Source is live; bin and obj stay inside the container.
      - ../Sandbox.API:/src/Sandbox.API
      - /src/Sandbox.API/bin
      - /src/Sandbox.API/obj

  sandbox.web:
    build:
      target: dev
    init: true
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      # Source is live; node_modules stays inside the image. After changing
      # package.json run: docker compose build sandbox.web
      - ../Sandbox.Web/src:/app/src
      - ../Sandbox.Web/angular.json:/app/angular.json:ro
      - ../Sandbox.Web/proxy.conf.docker.json:/app/proxy.conf.docker.json:ro
      - ../Sandbox.Web/tsconfig.json:/app/tsconfig.json:ro
      - ../Sandbox.Web/tsconfig.app.json:/app/tsconfig.app.json:ro

  sandbox.e2e:
    init: true
    ipc: host
    environment:
      - BASE_URL=http://sandbox.web:4200
      - API_URL=http://sandbox.api:8080
    volumes:
      # Report and failure traces land in Sandbox.Tests/results.
      - ../Sandbox.Tests/results:/work/Sandbox.Tests/results
      # Specs are live, so a test edit needs no image rebuild.
      - ../Sandbox.Web/e2e:/work/Sandbox.Web/e2e:ro
      - ../Sandbox.Web/playwright.config.ts:/work/Sandbox.Web/playwright.config.ts:ro
