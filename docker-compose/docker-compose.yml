# The services and how each image is built. Ports, environment, and dev volumes are
# in docker-compose.override.yml, which compose reads automatically from this folder.
# ESA's repos split their compose files the same way.
#
# The database is not a container. It is the SQL Server installed on this machine,
# reached from containers as host.docker.internal (one-time setup: see WORKFLOW.md).
#
#   cd docker-compose
#   docker compose up --build
#
# Angular     http://localhost:4200
# API         http://localhost:3211/health   (contract at /openapi/v1.json)
# SQL Server  localhost in SSMS, Windows Authentication, database LTInfoSandbox

name: sandbox

services:
  sandbox.api:
    image: sandbox/api
    build:
      context: ..
      dockerfile: Sandbox.API/Dockerfile
    extra_hosts:
      # Already defined by Docker Desktop; stated so the file also works on a plain Linux engine.
      - "host.docker.internal:host-gateway"

  sandbox.web:
    image: sandbox/web
    build:
      context: ../Sandbox.Web
      dockerfile: Dockerfile
    depends_on:
      - sandbox.api

  # The automated tests (Playwright, in a container). Not started by `up`:
  #   docker compose run --rm sandbox.e2e
  sandbox.e2e:
    image: sandbox/e2e
    build:
      context: ..
      dockerfile: Sandbox.Tests/Dockerfile
    profiles: ["test"]
    depends_on:
      - sandbox.web
      - sandbox.api
