<app-program-header [program]="program()" [tiles]="tracker.tiles()" variant="compact">
  <!-- The page says what the program is before it shows a chart, and where its status is. -->
  @if (lead(); as text) {
    <p slot="lead" class="lead typography-body-lg">{{ text }}</p>
  }
  @if (links().length > 0) {
    <app-header-links slot="lead" [links]="links()" />
  }
</app-program-header>

<!-- One choice for the whole page: the map and every chart on the filter's layer follow it. -->
@if (data().filters.length > 0) {
  <app-filter-bar [filters]="data().filters" [chosen]="chosen()" (choose)="choose($event)" />
}

<!-- The lead: the measurement charts, straight under the header. -->
<app-band lead data-section="measurements" title="Measurements">
  <app-measurements-block
    [data]="data()"
    [programName]="program().MonitoringProgramName"
    [tracker]="tracker"
  />
</app-band>

<!-- Only for a program with sites or areas to map: one with none has no Sites section. -->
@if (data().sites) {
  <app-band data-section="sites" title="Sites">
    <app-sites-block [data]="data()" [tracker]="tracker" />
    <app-per-year-block
      [data]="data()"
      [programName]="program().MonitoringProgramName"
      [tracker]="tracker"
    />
  </app-band>
}

<app-band data-section="about" title="About This Program">
  <div class="split">
    <app-program-story class="split__main" [description]="restOfDescription()" [approach]="approach()" />
    <app-program-partners class="split__side" [partners]="program().Partners" />
  </div>
</app-band>

@if (galleryPhotos().length > 0) {
  <app-band data-section="photos" title="Photos">
    <esa-card>
      <app-photo-gallery [images]="galleryPhotos()" />
    </esa-card>
  </app-band>
}
