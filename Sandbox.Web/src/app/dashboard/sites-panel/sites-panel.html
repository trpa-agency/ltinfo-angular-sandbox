<section
  class="sites-panel"
  [class.sites-panel--tall]="tall()"
  [class.sites-panel--no-list]="!showList()"
  [attr.aria-label]="title()"
  [attr.aria-busy]="state() === 'loading' ? 'true' : 'false'"
>
  <esa-card [title]="title()" padding="compact">
    <!--
      The pick sits in the card header. esa-card clips what leaves its box, and the
      select's menu opens downward over the map, which is taller than the menu can
      grow (256 px), so the menu is never cut off.
    -->
    <div slot="actions" class="sites-panel__tools">
      @if (pickOptions().length > 1) {
        <esa-select
          class="sites-panel__pick"
          size="sm"
          [label]="pickLabel()"
          [options]="pickOptions()"
          [value]="pickedValue()"
          (change)="onPick($event)"
        ></esa-select>
      }
      <esa-button
        class="sites-panel__csv"
        size="sm"
        variant="secondary"
        appearance="outline"
        [disabled]="state() !== 'ready'"
        (click)="downloadCsv()"
      >
        Download CSV
      </esa-button>
    </div>

    <div class="sites-panel__split">
      <div #mapColumn class="sites-panel__map">
        <app-sites-map
          [layers]="layers()"
          [label]="title() + ' map'"
          [profiles]="true"
          (featureSelect)="onFeatureSelect($event)"
          (cardClosed)="onCardClosed()"
        />
        <!-- The states sit over the map, so the Leaflet container keeps its size throughout. -->
        @switch (state()) {
          @case ('loading') {
            <div class="sites-panel__state" role="status">
              <span class="sites-panel__spinner" aria-hidden="true"></span>
              <p class="sites-panel__state-title typography-label-sm-strong">{{ loadingText() }}</p>
              @if (progressText()) {
                <p class="sites-panel__state-note typography-body-xs">{{ progressText() }}</p>
              }
            </div>
          }
          @case ('empty') {
            <div class="sites-panel__state">
              <esa-empty-state size="sm" [title]="emptyTitle()" [description]="emptyDescription()" />
            </div>
          }
          @case ('error') {
            <div class="sites-panel__state" role="alert">
              <esa-empty-state
                size="sm"
                title="Data could not be loaded"
                description="The TRPA map service did not respond. Reload the page to try again."
              />
            </div>
          }
        }
        <!--
          The site profile. Beside a wide map it moves into the list column (the rail) in place of
          the list; under a narrow map, or when there is no list, it stays here, under the map.
        -->
        <div #dock class="sites-panel__dock" [hidden]="!subject() || placement() === 'rail'">
          <div #card class="sites-panel__card">
            <app-site-profile
              [subject]="subject()"
              [profile]="profileConfig()"
              [panel]="config()"
              mode="docked"
              (closed)="closeProfile()"
              (zoom)="onZoom($event)"
            />
          </div>
        </div>
      </div>
      @if (showList()) {
        <div class="sites-panel__aside">
          <!-- The profile takes the list's place; Back to List returns to it. -->
          <div #rail class="sites-panel__rail" [hidden]="!railOpen()">
            <esa-button class="sites-panel__back" size="sm" variant="ghost" (click)="closeProfile()">
              <span aria-hidden="true">&#8249;</span> Back to List
            </esa-button>
          </div>
          <app-site-list
            class="sites-panel__list"
            [class.is-hidden]="railOpen()"
            [items]="items()"
            [groups]="groups()"
            [unit]="unit()"
            [selectedKey]="selectedKey()"
            [message]="listMessage()"
            [busy]="state() === 'loading'"
            (siteSelect)="onSiteSelect($event)"
          />
        </div>
      }
    </div>

    @if (source(); as link) {
      <p slot="footer" class="sites-panel__source">
        Source: <a [href]="link.href" target="_blank" rel="noopener">{{ link.label }}</a>
      </p>
    }
  </esa-card>
</section>
